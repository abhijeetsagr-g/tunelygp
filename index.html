<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tunely — Offline music player</title>
  <meta name="description" content="Tunely, an offline-first Flutter music player.">

  <link rel="icon" type="image/png" href="screenshots/icon.png">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sections.css">

  <!-- Loaded before first paint so the theme never flashes -->
  <script src="js/theme-toggle.js"></script>
</head>
<body>

  <!-- ============================================================
       Top bar — brand (left) + theme toggle (right)
       ============================================================ -->
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="topbar__brand" href="#home-showcase">
        <img class="topbar__logo" src="screenshots/icon.png" alt="" width="32" height="32">
        <span>Tunely</span>
      </a>

      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        role="switch"
        aria-checked="false"
        aria-label="Toggle dark mode"
      >
        <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
        </span>
        <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
        <span class="theme-toggle__thumb" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <main>

    <!-- ============================================================
         Section 1 — Home showcase: screenshot + feature list
         ============================================================ -->
    <section class="section" id="home-showcase">
      <div class="container showcase__grid">
        <figure class="showcase__media">
          <img
            class="showcase__screenshot"
            src="screenshots/home_light.png"
            data-light="screenshots/home_light.png"
            data-dark="screenshots/home_dark.png"
            alt="Tunely home screen showing Top Songs, Daily Mix, Album Recommendation, and Recently Played"
           
            loading="lazy"
          >
        </figure>

        <ul class="showcase__list">
          <li class="showcase__item">Top Songs</li>
          <li class="showcase__item">Daily Mix</li>
          <li class="showcase__item">Album Recommendation</li>
          <li class="showcase__item">Recently Played</li>
        </ul>
      </div>

      <div class="showcase__cta">
        <a class="download-btn" href="https://release-assets.githubusercontent.com/github-production-release-asset/1172926139/e3b8b318-1f48-4480-aae3-3446a6c64dce?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-08-13T15%3A43%3A00Z&rscd=attachment%3B+filename%3Dtunely.apk&rsct=application%2Fvnd.android.package-archive&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-08-13T14%3A42%3A18Z&ske=2026-08-13T15%3A43%3A00Z&sks=b&skv=2018-11-09&sig=%2BLPkR0rVU%2Fk3sXwSb7DevJXAWm8pq6W9Mg8ZVt0wqrA%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4NjYzNDI2MywibmJmIjoxNzg2NjMyNDYzLCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.JZ19_PU3fx9cBc5L_F2W1X_5hefXbpPPImTEtBKiiWQ&response-content-disposition=attachment%3B%20filename%3Dtunely.apk&response-content-type=application%2Fvnd.android.package-archive">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Download
        </a>
      </div>
    </section>

    <!-- ============================================================
         Section 3 — Library row: Songs / Albums / Artists / Playlists
         Add new tabs here; copy one .screenshot-card block.
         ============================================================ -->
    <section class="section" id="library">
      <div class="container screenshot-row">
        <figure class="screenshot-card">
          <img class="screenshot-card__img"
               src="screenshots/library_song_light.png"
               data-light="screenshots/library_song_light.png"
               data-dark="screenshots/library_song_dark.png"
               alt="Songs tab" loading="lazy">
          <figcaption class="screenshot-card__caption">Songs</figcaption>
        </figure>

        <figure class="screenshot-card">
          <img class="screenshot-card__img"
               src="screenshots/library_album_light.png"
               data-light="screenshots/library_album_light.png"
               data-dark="screenshots/library_album_dark.png"
               alt="Albums tab" loading="lazy">
          <figcaption class="screenshot-card__caption">Albums</figcaption>
        </figure>

        <figure class="screenshot-card">
          <img class="screenshot-card__img"
               src="screenshots/library_artist_light.png"
               data-light="screenshots/library_artist_light.png"
               data-dark="screenshots/library_artist_dark.png"
               alt="Artists tab" loading="lazy">
          <figcaption class="screenshot-card__caption">Artists</figcaption>
        </figure>

        <figure class="screenshot-card">
          <img class="screenshot-card__img"
               src="screenshots/library_playlist_light.png"
               data-light="screenshots/library_playlist_light.png"
               data-dark="screenshots/library_playlist_dark.png"
               alt="Playlists tab" loading="lazy">
          <figcaption class="screenshot-card__caption">Playlists</figcaption>
        </figure>
      </div>
    </section>

    <!-- ============================================================
         Section 4 — Playback row: Queue / Player / Lyrics
         ============================================================ -->
    <section class="section" id="playback">
      <div class="container screenshot-row">
        <figure class="screenshot-card">
          <img class="screenshot-card__img"
               src="screenshots/queue_light.png"
               data-light="screenshots/queue_light.png"
               data-dark="screenshots/queue_dark.png"
               alt="Playback queue" loading="lazy">
          <figcaption class="screenshot-card__caption">Queue</figcaption>
        </figure>

        <figure class="screenshot-card">
          <img class="screenshot-card__img"
               src="screenshots/player_light.png"
               data-light="screenshots/player_light.png"
               data-dark="screenshots/player_dark.png"
               alt="Now playing player" loading="lazy">
          <figcaption class="screenshot-card__caption">Player</figcaption>
        </figure>

        <figure class="screenshot-card">
          <img class="screenshot-card__img"
               src="screenshots/lyrics_light.png"
               data-light="screenshots/lyrics_light.png"
               data-dark="screenshots/lyrics_dark.png"
               alt="Synced lyrics view" loading="lazy">
          <figcaption class="screenshot-card__caption">Lyrics</figcaption>
        </figure>
      </div>
    </section>

    <!-- ============================================================
         Section 5 — Album & Playlist detail views
         ============================================================ -->
    <section class="section" id="album-playlist">
      <div class="container screenshot-row">
        <figure class="screenshot-card">
          <img class="screenshot-card__img screenshot-card__img--lg"
               src="screenshots/album_light.png"
               data-light="screenshots/album_light.png"
               data-dark="screenshots/album_dark.png"
               alt="Album detail view" loading="lazy">
          <figcaption class="screenshot-card__caption">Album</figcaption>
        </figure>

        <figure class="screenshot-card">
          <img class="screenshot-card__img screenshot-card__img--lg"
               src="screenshots/playlist_light.png"
               data-light="screenshots/playlist_light.png"
               data-dark="screenshots/playlist_dark.png"
               alt="Playlist detail view" loading="lazy">
          <figcaption class="screenshot-card__caption">Playlist</figcaption>
        </figure>
      </div>
    </section>

    <!-- ============================================================
         Section 6 — Theming demo: animated settings GIF
         ============================================================ -->
    <section class="section theming" id="theming">
      <div class="container theming__inner">
        <img class="theming__gif"
             src="screenshots/settings.gif"
             alt="Animated preview of Tunely's theme settings" loading="lazy">
        <p class="theming__caption">Customize your theme</p>
      </div>
    </section>

  </main>

  <!-- ============================================================
       Footer — GitHub link
       ============================================================ -->
  <footer class="footer">
    <div class="container footer__inner">
      <a class="footer__link" href="https://github.com/abhijeetsagr-g/tunely">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
        GitHub
      </a>
    </div>
  </footer>

</body>
</html>
